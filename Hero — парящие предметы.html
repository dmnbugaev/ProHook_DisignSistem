<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero — парящие предметы</title>
<style>
:root{--ui-bg:rgba(255,255,255,.88);--ui-fg:#1c1c1e;--ui-line:rgba(0,0,0,.14);--c1:#e6e6e6;--c2:#f6f6f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui-bg:rgba(30,30,32,.88);--ui-fg:#f2f2f4;--ui-line:rgba(255,255,255,.18);--c1:#2a2a2c;--c2:#333336}}
:root[data-theme="dark"]{--ui-bg:rgba(30,30,32,.88);--ui-fg:#f2f2f4;--ui-line:rgba(255,255,255,.18);--c1:#2a2a2c;--c2:#333336}
html,body{height:100%;margin:0;overflow:hidden;font:14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--c2)}
/* Фон — только для предпросмотра. Сама анимация (#stage) полностью прозрачна. */
#bg{position:fixed;inset:0;background:var(--c2)}
#bg.checker{background:conic-gradient(var(--c1) 25%,var(--c2) 0 50%,var(--c1) 0 75%,var(--c2) 0) 0 0/28px 28px}
#bg.light{background:#fff}
#bg.dark{background:#0d0d10}
#stage{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.item{position:absolute;left:50%;top:50%;will-change:transform,filter,opacity;opacity:0}
.item img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
#ui{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 10px;z-index:1000}
#ui button{font:inherit;color:var(--ui-fg);background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(8px)}
#ui button[aria-pressed="true"]{outline:2px solid var(--ui-fg)}
</style>
</head>
<body>
<div id="bg" class="checker"></div>
<div id="stage"></div>
<div id="ui">
  <button data-bg="checker" aria-pressed="true">Прозрачность</button>
  <button data-bg="light" aria-pressed="false">Светлый фон</button>
  <button data-bg="dark" aria-pressed="false">Тёмный фон</button>
  <button id="replay">Повторить интро</button>
</div>

// Длинная сторона в долях меньшей стороны кадра: повербанки > коробки > конфеты
const SIZE = {device:.31, pack:.15, stick:.09};
// Порядок предметов перемешан (конфеты повторяются); позиции раскладываются автоматически в layout()
const ORDER = [2,7,5,0,8,11,2,9,5,1,8,6,2,10,5,3,8,4,2];

const TAU=Math.PI*2, INTRO=3.5, LOOP=6, BURST=.5;
let seed=23; const R=()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646);
const rnd=(a,b)=>a+R()*(b-a), sgn=()=>R()<.5?-1:1;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const stage=document.getElementById('stage');

const items=ORDER.map(idx=>{
  const d=IMGS[idx], el=document.createElement('div'); el.className='item';
  const im=document.createElement('img'); im.src=d.src; im.alt=''; im.draggable=false; el.appendChild(im);
  stage.appendChild(el);
  return {el,asp:d.w/d.h,kind:d.kind,kk:d.k||1,
    cl:[rnd(-.07,.07),rnd(-.07,.07),rnd(-.3,.3)],          // старт: плотная кучка
    om:rnd(6,9),ze:rnd(.55,.72),dj:rnd(0,.06),delay:0,     // пружина разлёта
    arc:rnd(-.22,.22),spin:sgn()*rnd(180,460),rest:rnd(-10,10),
    a:[rnd(.010,.022),rnd(.016,.03),rnd(.02,.05)],ar:rnd(3,8),
    k:[1+Math.floor(R()*2),1+Math.floor(R()*2),1+Math.floor(R()*2),1+Math.floor(R()*2)],
    ph:[R()*TAU,R()*TAU,R()*TAU,R()*TAU],wph:0,ox:0,oy:0,
    tx:0,ty:0,tz:0,dz:rnd(-.4,.4),par:0,w:0,h:0};
});

let W,H,u,portrait;
function layout(){
  W=innerWidth;H=innerHeight;u=Math.min(W,H);portrait=W<H;
  const mf=portrait?1.45:1;
  items.forEach(it=>{
    const L=SIZE[it.kind]*it.kk*u*mf;
    it.w=it.asp>=1?L:L*it.asp; it.h=it.asp>=1?L/it.asp:L;
    const e=it.el.style; e.width=it.w+'px'; e.height=it.h+'px'; e.marginLeft=-it.w/2+'px'; e.marginTop=-it.h/2+'px';
  });
  // детерминированный разброс с минимальной дистанцией; центральный эллипс свободен под заголовок
  let s2=5; const r2=()=>(s2=(s2*16807)%2147483647,(s2-1)/2147483646);
  const placed=[], fx=portrait?.8:.5, fy=portrait?.22:.36;
  [...items].sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)).forEach(it=>{
    const r=Math.max(it.w,it.h)*.5, mx=W/2-r*.8-10, my=H/2-r*.8-10;
    let best={x:mx,y:my},bd=-1e9;
    for(let n=0;n<400;n++){
      const x=(r2()*2-1)*mx, y=(r2()*2-1)*my;
      if(((x/(W/2))/fx)**2+((y/(H/2))/fy)**2<1)continue;
      let md=1e9; placed.forEach(p=>{md=Math.min(md,Math.hypot(x-p.x,y-p.y)-(r+p.r)*.85)});
      if(md>bd){bd=md;best={x,y}}
      if(md>Math.max(r*.5,12))break;
    }
    it.tx=best.x; it.ty=best.y; placed.push({x:best.x,y:best.y,r});
  });
  items.forEach(it=>{
    it.tz=it.dz*u*.7; it.par=(portrait?9:24)*(1+it.dz*1.5);
    it.el.style.zIndex=Math.round((it.dz+1)*50);
    it.delay=.03+.2*Math.min(1,Math.hypot(it.tx/(W/2),it.ty/(H/2))/1.2)+it.dj;   // волна от центра к краям
    it.wph=it.tx/W*TAU*.8;                                                         // бегущая волна в парении
  });
}

function spring(it,tau){ // затухающая пружина: быстрый старт, лёгкий перелёт, мягкая посадка
  if(tau<=0)return 1;
  const a=it.ze*it.om, wd=it.om*Math.sqrt(1-it.ze*it.ze);
  return Math.exp(-a*tau)*(Math.cos(wd*tau)+a/wd*Math.sin(wd*tau));
}
function pose(it,t){
  const e=1-spring(it,t-BURST-it.delay);
  const comp=1-.22*sm(0,BURST,t);                      // «сжатие» перед взрывом
  const w=sm(1.4,INTRO,t);                              // парение включается плавно
  const ph=n=>Math.sin(TAU*it.k[n]*t/LOOP+it.ph[n]+(n===1?it.wph:0));  // целые k → цикл ровно 6 с
  const cx=it.cl[0]*u*comp, cy=it.cl[1]*u*comp, dx=it.tx-cx, dy=it.ty-cy, arc=4*e*(1-e)*it.arc;
  return {
    x:cx+dx*e-dy*arc+w*it.a[0]*u*ph(0),
    y:cy+dy*e+dx*arc+w*it.a[1]*u*ph(1),
    z:it.cl[2]*u*(1-e)+it.tz*e+w*it.a[2]*u*ph(2),
    r:it.rest+it.spin*(1-e)+w*it.ar*ph(3),
    s:.3+.7*e, o:sm(0,.3,t)};
}

let px=0,py=0,tpx=0,tpy=0,pcx=1e5,pcy=1e5;
function frame(t){
  px+=(tpx-px)*.06; py+=(tpy-py)*.06;
  const rw=sm(2,INTRO,t), RR=u*.26;
  items.forEach(it=>{
    const p=pose(it,t), q=pose(it,t-1/60), f=1100/(1100-p.z);
    const sx=p.x*f, sy=p.y*f, dxp=sx-pcx, dyp=sy-pcy, dd=Math.hypot(dxp,dyp)||1;
    const fo=dd<RR?Math.pow(1-dd/RR,2):0;               // курсор мягко отталкивает предметы
    it.ox+=(dxp/dd*fo*u*.09*rw-it.ox)*.08; it.oy+=(dyp/dd*fo*u*.09*rw-it.oy)*.08;
    const x=sx-px*it.par+it.ox, y=sy-py*it.par*.6+it.oy;
    const v=Math.hypot(p.x-q.x,p.y-q.y), mb=Math.min(4,Math.max(0,(v-5)*.12));
    const b=mb+Math.max(0,-it.dz)*3;                    // размытие скоростью + глубина резкости для дальних
    const st=it.el.style;
    st.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${p.r.toFixed(2)}deg) scale(${(p.s*f).toFixed(3)})`;
    st.opacity=p.o.toFixed(3);
    st.filter=b>.15?`blur(${b.toFixed(2)}px)`:'none';
  });
}

let t0=performance.now();
function tick(now){frame((now-t0)/1000);requestAnimationFrame(tick)}
layout(); addEventListener('resize',layout);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){frame(INTRO+1)}
else{
  requestAnimationFrame(tick);
  addEventListener('pointermove',e=>{tpx=(e.clientX/W-.5)*2;tpy=(e.clientY/H-.5)*2;pcx=e.clientX-W/2;pcy=e.clientY-H/2});
  const off=()=>{tpx=tpy=0;pcx=pcy=1e5};
  document.addEventListener('pointerleave',off);addEventListener('pointerup',off);addEventListener('pointercancel',off);
}
document.getElementById('replay').onclick=()=>{t0=performance.now()};
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{
  document.getElementById('bg').className=b.dataset.bg;
  document.querySelectorAll('[data-bg]').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
</script>
</body>
